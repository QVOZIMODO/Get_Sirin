<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Sirin — private, multi-protocol, Telegram-first VPN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3A8A"/>
      <stop offset="0.55" stop-color="#19337b"/>
      <stop offset="1" stop-color="#13265c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EA"/>
      <stop offset="1" stop-color="#EDE6D2"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- signal arcs (rotation / broadcast motif) -->
  <g fill="none" stroke="#FAF6EA" stroke-linecap="round">
    <circle cx="1150" cy="92" r="60"  stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="1150" cy="92" r="110" stroke-opacity="0.11" stroke-width="2"/>
    <circle cx="1150" cy="92" r="165" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="1150" cy="92" r="225" stroke-opacity="0.045" stroke-width="2"/>
  </g>
  <circle cx="1150" cy="92" r="9" fill="#6BB07E"/>

  <!-- left accent rule -->
  <rect x="80" y="92" width="6" height="120" rx="3" fill="#FAF6EA" fill-opacity="0.9"/>

  <!-- wordmark -->
  <text x="112" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="10" fill="url(#ink)">SIRIN</text>

  <!-- tagline -->
  <text x="116" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="500" letter-spacing="1.5" fill="#EDE6D2" fill-opacity="0.92">
    Private · Multi-protocol · Telegram-first
  </text>

  <!-- protocol chips -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FAF6EA">
    <g>
      <rect x="116" y="262" width="132" height="38" rx="19" fill="none" stroke="#FAF6EA" stroke-opacity="0.45"/>
      <text x="182" y="287" text-anchor="middle">WireGuard</text>
    </g>
    <g>
      <rect x="262" y="262" width="172" height="38" rx="19" fill="none" stroke="#FAF6EA" stroke-opacity="0.45"/>
      <text x="348" y="287" text-anchor="middle">VLESS + Reality</text>
    </g>
    <g>
      <rect x="448" y="262" width="156" height="38" rx="19" fill="none" stroke="#FAF6EA" stroke-opacity="0.45"/>
      <text x="526" y="287" text-anchor="middle">Shadowsocks</text>
    </g>
    <g>
      <rect x="618" y="262" width="150" height="38" rx="19" fill="none" stroke="#FAF6EA" stroke-opacity="0.45"/>
      <text x="693" y="287" text-anchor="middle">AmneziaWG</text>
    </g>
  </g>

  <!-- corner mark -->
  <text x="1200" y="332" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" letter-spacing="2" fill="#FAF6EA" fill-opacity="0.5">
    what works today, wherever you are
  </text>
</svg>
